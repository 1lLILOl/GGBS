<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGBS - Use sombras como GPS</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    
    <h1 class="title">
        GGBS
    </h1>

    <div class="content">

        <div id="sections">

            <button class="sectionBtns" data-section="saveData">
                Salvar
            </button>

            <button class="sectionBtns" data-section="measureDist">
                Distância
            </button>

            <button class="sectionBtns" data-section="viewData">
                Ver
            </button>

        </div>


        <div id="renderDiv">



        </div>

        <!-- <div id="backgroundImgs">

            <img class="largeImg" src="img/terraEsfera.jpg">
        </div> -->

        <div id="activeDivContainer">

            <div id="activeDiv">

                <datalist id="searchOptions"></datalist>

                <div id="saveData" class="sectionDivs">

                    <h2 class="subtitle">Salvar dados</h2>

                    <div class="alignedInputDivsContainer">  

                        <div class="alignedInputDiv">
                            <label for="placeName">Nome do lugar:</label>
                            <input type="text" id="placeName" name="placeName" list="searchOptions" placeholder="Xique-Xique, Bahia">
                        </div>
                        

                        <div class="alignedInputDiv">
                            <label for="date">Data:</label>
                            <input type="date" id="date" name="date">
                        </div>
                        
                        <div class="alignedInputDiv">
                            <label for="time">Horário:</label>
                            <input type="time" id="time" name="time">
                        </div>

                        <!-- <div class="alignedInputDiv">
                            <label for="time">Horário e fuso-horário:</label>
                            <input type="time" id="time" name="time">
                            <select name="timezone" id="timezone"></select>
                        </div> -->


                        <div class="alignedInputDiv switchLength">
                            <label for="shadowLength">Tamanho da sombra(centímetros):</label>
                            <input type="number" id="shadowLength" name="shadowLength" placeholder="10">
                        </div>

                        <div class="alignedInputDiv">
                            <label class="switchAngle" for="shadowAngle">Ângulo da sombra(graus):</label>
                            <input class="switchAngle" type="number" id="shadowAngle" name="shadowAngle" placeholder="30">

                            
                            <label class="switchLength" for="stickHeight">Tamanho do objeto vertical(centímetros):</label>
                            <input class="switchLength" type="number" id="stickHeight" name="stickHeight" placeholder="70">
                        </div>


                        <div class="alignedInputDiv">
                            <label class="switchAngle" for="northAngle">*Opcional - Ângulo do norte(graus):</label>
                            <input class="switchAngle" type="number" id="northAngle" name="northAngle" placeholder="30">
                            

                            <label class="switchLength" for="northProjection">Tamanho da projeção do norte(centímetros):</label>
                            <input class="switchLength" type="number" id="northProjection" name="northProjection" placeholder="70">
                        </div>


                        <div class="alignedInputDiv">

                            <div class="utilBtnsDiv">

                                <button id="fillNowHere">Hoje</button>

                                <button id="switchAngleLength">x/y</button>

                            </div>

                            

                            <button class="sendData">Enviar</button>
                        </div>
                    </div>
                    
                    
                </div>

                <div id="measureDist" class="sectionDivs">

                    <h2 class="subtitle">Distância - 2 locais</h2>


                    <div class="alignedInputDivsContainer">

                        <div class="alignedInputDiv">

                            <label for="firstPlaceName">Nome do primeiro lugar:</label>
                            <input type="text" id="firstPlaceName" name="firstPlaceName" list="searchOptions">
                        </div>

                        <div class="alignedInputDiv">
                            
                            <label for="secondPlaceName">Nome do segundo lugar:</label>
                            <input type="text" id="secondPlaceName" name="secondPlaceName" list="searchOptions">
                        </div>

                        <div class="alignedInputDiv showData">



                        </div>

                        <div class="alignedInputDiv">
                            <button class="sendData">Medir distância</button>
                        </div>

                    </div>

                </div>


                <div id="viewData" class="sectionDivs">

                    <h2 class="subtitle">Ver dados</h2>

                    <div class="alignedInputDivsContainer">

                        <div class="alignedInputDiv">
                            <label for="placeName">Nome do lugar:</label>
                            <input type="text" id="placeName" name="placeName" list="searchOptions">
                        </div>

                        <div class="alignedInputDiv showData">



                        </div>

                        <div class="alignedInputDiv">
                            <button class="sendData">Ver</button>
                        </div>

                    </div>
                 </div>

            </div>
        </div>
        

        

    </div>

    <script src="scripts/main.js" type="module"></script>

</body>
</html>
