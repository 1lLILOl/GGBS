<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGBS - Use sombras como GPS</title>
    <link rel="stylesheet" href="styles/index.css">
</head>
<body>
    
    <h1 class="title">
        GGBS
    </h1>

    <div class="content">

        <div id="sections">

            <button id="openSaveSection">
                Save
            </button>

            <button id="openDistanceMeasureSection">
                Dist
            </button>

        </div>


        <div id="backgroundImgs">

            <img class="smallImg" src="img/SienaVsAlexandria.png">
        </div>

        <div id="activeDivContainer">

            <div id="activeDiv">

                <div id="saveData">

                    <label for="placeName">Nome do lugar:</label>
                    <input type="text" id="placeName" name="placeName">
                </div>

                <div id="measureDist">

                    <label for="firstPlaceName">Nome do primeiro lugar:</label>
                    <input type="text" id="firstPlaceName" name="firstPlaceName">
                </div>

            </div>
        </div>
        

        

    </div>

    <script src="scripts/index.js"></script>

</body>
</html>
